name: Live strategy scan
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client==1.8.0 matplotlib==3.9.2 requests
      - name: Scan 37 coins (TradingView feed)
        id: scan
        run: python scanner/scan.py trx/data.json
      - name: Scan Nifty 100 (TradingView data only)
        continue-on-error: true
        run: python scanner/scan.py trx/india/data.json --market=india
      - name: Commit every run (new data or heartbeat)
        run: |
          set -e
          last=$(git log -1 --format=%ct -- trx/data.json || echo 0); last=${last:-0}
          age=$(( $(date +%s) - last ))
          echo "changed=${{ steps.scan.outputs.changed }} heartbeat_age=${age}s"
          if true; then
            git config user.name "trx-scan-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trx/data.json trx/data trx/charts trx/india scanner/nifty100.json
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            if [ "${{ steps.scan.outputs.changed }}" = "true" ]; then msg="scan: new data"; else msg="scan: heartbeat"; fi
            git commit -m "$msg $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          else
            echo "No change and heartbeat fresh, skipping commit"
          fi
