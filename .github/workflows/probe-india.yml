name: Probe India data sources (manual, temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client==1.8.0 requests matplotlib==3.9.2
      - name: TradingView NSE probe
        run: python scanner/probe/tv_nse_probe.py || true
      - name: NSE probe
        run: python scanner/probe/nse_probe.py || true
